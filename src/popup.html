<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search tabs</title>
<style>
:root {
	color-scheme: light dark;
	--bg: #ffffff;
	--fg: #1a1a1a;
	--line: rgba(0, 0, 0, 0.1);
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #26282b;
		--fg: #e8eaed;
		--line: rgba(255, 255, 255, 0.12);
	}
}
html, body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
body { width: 480px; }
input {
	box-sizing: border-box;
	width: 100%;
	padding: 12px 14px;
	border: 0;
	border-bottom: 1px solid var(--line);
	background: transparent;
	color: inherit;
	font: inherit;
	font-size: 14px;
	outline: none;
}
#list {
	max-height: 520px;
	overflow-y: auto;
	scrollbar-width: none;
	padding: 6px;
}
</style>
</head>
<body>
<input id="query" type="search" placeholder="Search tabs" autocomplete="off" spellcheck="false" autofocus>
<div id="list" role="listbox"></div>
<script src="rows.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
